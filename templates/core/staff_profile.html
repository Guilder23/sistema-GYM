{% extends 'base.html' %}
{% block title %}Mi Perfil - GYM PRO{% endblock %}
{% block page_title %}MI PERFIL{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header">
        <h3 class="card-title">Información de Usuario</h3>
    </div>
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 32px;">
                <div class="profile-photo-preview" style="width: 150px; height: 150px; border-radius: 50%; overflow: hidden; border: 4px solid var(--color-primary); background: var(--bg-card);">
                    {% if profile.profile_photo %}
                        <img src="{{ profile.profile_photo.url }}" id="photo-preview" style="width: 100%; height: 100%; object-fit: cover;">
                    {% else %}
                        <img src="https://ui-avatars.com/api/?name={{ request.user.username }}&background=6366f1&color=fff&size=150" id="photo-preview" style="width: 100%; height: 100%; object-fit: cover;">
                    {% endif %}
                </div>
                <label for="profile_photo" class="btn btn-secondary btn-sm" style="cursor: pointer;">
                    <i class="fas fa-camera"></i> Cambiar Foto de Perfil
                </label>
                <input type="file" id="profile_photo" name="profile_photo" style="display: none;" accept="image/*" onchange="previewImage(this)">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Nombre de Usuario</label>
                    <input type="text" class="form-control" value="{{ request.user.username }}" disabled>
                    <p style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">El nombre de usuario no se puede cambiar.</p>
                </div>
                <div class="form-group">
                    <label>Rol</label>
                    <input type="text" class="form-control" value="{{ profile.role_label }}" disabled>
                </div>
                <div class="form-group">
                    <label for="first_name">Nombre</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" value="{{ request.user.first_name }}">
                </div>
                <div class="form-group">
                    <label for="last_name">Apellido</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" value="{{ request.user.last_name }}">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" value="{{ request.user.email }}">
                </div>
                <div class="form-group">
                    <label for="password">Nueva Contraseña (dejar en blanco para no cambiar)</label>
                    <input type="password" id="password" name="password" class="form-control">
                </div>
            </div>

            <div class="form-actions" style="margin-top: 32px; display: flex; gap: 12px; justify-content: flex-end;">
                <button type="submit" class="btn btn-primary">Actualizar Perfil</button>
            </div>
        </form>
    </div>
</div>

<script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('photo-preview').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}
