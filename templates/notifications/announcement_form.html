{% extends 'base.html' %}
{% block title %}Nuevo Comunicado - GYM PRO{% endblock %}
{% block page_title %}CREAR COMUNICADO GENERAL{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header">
        <h3 class="card-title">Enviar a todos los usuarios</h3>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="title">Título del Comunicado</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="Ej: Mantenimiento de máquinas, Nueva clase..." required>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="message">Mensaje / Contenido</label>
                <textarea id="message" name="message" class="form-control" rows="5" placeholder="Escribe aquí el mensaje que recibirán todos..." required></textarea>
            </div>
            <div class="form-actions" style="display: flex; gap: 12px; justify-content: flex-end;">
                <a href="{% url 'notification_list' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> Enviar Comunicado
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
