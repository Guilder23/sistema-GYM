{% extends 'base.html' %}
{% block title %}Nueva Rutina - GYM PRO{% endblock %}
{% block page_title %}NUEVA RUTINA{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header">
        <h3 class="card-title">Información de la Rutina</h3>
        <a href="{% url 'routine_list' %}" class="btn btn-secondary btn-sm">Cancelar</a>
    </div>
    <div class="card-body">
        <form action="" method="POST">
            {% csrf_token %}
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <div class="form-group" style="grid-column: span 2;">
                    <label>Nombre de la Rutina</label>
                    <input type="text" name="name" class="form-control" placeholder="Ej: Rutina de Volumen A" required>
                </div>
                
                <div class="form-group">
                    <label>Cliente</label>
                    <select name="client_id" class="form-control" required>
                        <option value="">Seleccionar cliente</option>
                        {% for client in clients %}
                        <option value="{{ client.id }}">{{ client.full_name }} - {{ client.ci }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Entrenador Asignado (opcional)</label>
                    <select name="trainer_id" class="form-control">
                        <option value="">Sin entrenador</option>
                        {% for trainer in trainers %}
                        <option value="{{ trainer.id }}">{{ trainer.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group" style="grid-column: span 2;">
                    <label>Notas / Objetivos</label>
                    <textarea name="notes" class="form-control" rows="4" placeholder="Ej: Enfocada en fuerza, 4 días a la semana..."></textarea>
                </div>
            </div>

            <div style="margin-top: 32px; display: flex; justify-content: flex-end;">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-arrow-right"></i> Continuar a Ejercicios
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
